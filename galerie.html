    const taskShortTitles = {
        "1": "Aufgabe 1: Kuss-Foto / Selfie",
        "2": "Aufgabe 2: Am längsten zusammen",
        "14": "Aufgabe 14: Weiteste Anreise",
        "27": "Aufgabe 27: Muttis des Brautpaares",
        "28": "Aufgabe 28: Alle Großeltern des Brautpaares",
        "35": "Aufgabe 35: Auto kaputt gefahren",
        "36": "Aufgabe 36: Am Tisch sitzen",
        "39": "Aufgabe 39: Torte & Bäckerin",
        "43": "Aufgabe 43: Peinliches Bild Sven Jäger",
        "45": "Aufgabe 45: Fotograf Lars knipst",
        "46": "Aufgabe 46: Ein Tier sehen",
        "47": "Aufgabe 47: Spitzname „Schaufel“",
        "48": "Aufgabe 48: Gastronomie- / Hotelbetrieb"
    };

    let gefilterteBilder = [];
    let currentLightboxIndex = -1;

    window.onload = filterGallery;

    function filterGallery() {
        const filterValue = document.getElementById('galleryFilter').value;
        const gallery = document.getElementById('guestGallery');
        gallery.innerHTML = "";

        gefilterteBilder = allImagesData.filter(item => filterValue === "all" ? true : item.task === filterValue);

        if (gefilterteBilder.length === 0) {
            gallery.innerHTML = "<p style='color:#999; grid-column: 1/-1; padding: 20px;'>Keine Fotos in dieser Kategorie vorhanden.</p>";
            return;
        }

        gefilterteBilder.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = 'media-card';
            
            const img = document.createElement('img');
            img.src = `bilder/${item.file}`;
            img.onclick = () => openLightbox(index);
            card.appendChild(img);

            const infoArea = document.createElement('div');
            infoArea.className = 'info-area';
            
            if (item.task && item.task !== "0") {
                const badge = document.createElement('div');
                badge.className = 'task-badge';
                badge.innerText = taskShortTitles[item.task] || `Aufgabe ${item.task}`;
                infoArea.appendChild(badge);
            }
            
            const cap = document.createElement('div');
            cap.className = 'caption-text';
            cap.innerText = item.caption ? `👤 ${item.caption}` : "💝 Hochzeitstag";
            infoArea.appendChild(cap);

            card.appendChild(infoArea);
            gallery.appendChild(card);
        });
    }

    function openLightbox(index) {
        document.getElementById('lightbox').style.display = 'block';
        currentLightboxIndex = index;
        updateLightboxContent();
    }

    function closeLightbox() {
        document.getElementById('lightbox').style.display = 'none';
        currentLightboxIndex = -1;
    }

    function navigateLightbox(direction) {
        currentLightboxIndex += direction;
        if (currentLightboxIndex >= gefilterteBilder.length) currentLightboxIndex = 0;
        if (currentLightboxIndex < 0) currentLightboxIndex = gefilterteBilder.length - 1;
        updateLightboxContent();
    }

    function updateLightboxContent() {
        const item = gefilterteBilder[currentLightboxIndex];
        document.getElementById('lightboxImg').src = `bilder/${item.file}`;
        const taskText = (item.task && item.task !== "0") ? ` • ${taskShortTitles[item.task]}` : "";
        document.getElementById('lightboxInfo').innerText = `${item.caption || "Foto"}${taskText}`;
    }

    document.addEventListener('keydown', function(e) {
        if (document.getElementById('lightbox').style.display === 'block') {
            if (e.key === 'ArrowLeft') navigateLightbox(-1);
            if (e.key === 'ArrowRight') navigateLightbox(1);
            if (e.key === 'Escape') closeLightbox();
        }
    });
